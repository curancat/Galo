<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Miraculos do Galo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    body {
      background: #330000; color: #FFD700;
      font-family:'Lobster', cursive;
      display:flex; align-items:center; justify-content:center;
      height:100vh; position:relative;
    }
    .phone {
      width:320px; height:600px;
      background:#660000; border-radius:30px;
      box-shadow:0 10px 25px rgba(255,140,0,0.6);
      padding:20px; display:flex;
      flex-direction:column; justify-content:space-between;
    }
    h3 mark {
      background:#FF4500; color:#fff;
      padding:5px 10px; border-radius:8px;
    }
    h3{text-align:center;font-size:24px}
    .buttons{display:flex;flex-direction:column;align-items:center;gap:8px}
    button {
      width:80%; padding:10px;
      background:#FF8C00; border:none;
      border-radius:20px; font-size:18px;
      color:#fff; cursor:pointer; transition:.3s;
      font-family:'Lobster',cursive;
    }
    button:hover{background:#FFA500}
  </style>
</head>
<body>
  <div class="phone">
    <h3><mark>Abrax</mark></h3>
    <div class="buttons">
      <button onclick="enviarMensagem()">💬 Enviar mensagem</button>
      <button onclick="lerConversa()">📖 Ler conversa</button>
      <button onclick="autoConceder()">✨ Sublimação</button>
      <button onclick="verPoderes()">💼 Meus Poderes</button>
      <button onclick="usarPoder()">🔥 Usar habilidade</button>
    </div>
  </div>

  <script>
    alert('ORIKKO SOL NASCENTE!');
    const PARTICIPANTES = ['Litlegot','Psique','Abrax','Hell Cat','Beast','Yellowfee','Lindemberg'];
    const ME = 'Abrax';
    const channel = new BroadcastChannel('global_channel');
    const _load = k => JSON.parse(localStorage.getItem(k)||'[]');
    const _save = (k,v) => localStorage.setItem(k, JSON.stringify(v));

    // Powers: {from:'X',to:'Abrax',power:'...',meta:{...}}
    channel.onmessage = ev => {
      const {type,data} = ev.data;
      if(type==='msg'&& data.to===ME) alert(`📨 De ${data.from}: ${data.text}`);
      if(type==='power'&& data.to===ME){
        const ps=_load('powers'); ps.push(data); _save('powers',ps);
        alert(`🔮 Você adquiriu: ${data.power}`);
      }
    };

    function enviarMensagem(){
      let dest=prompt(`Enviar para?\n${PARTICIPANTES.filter(p=>p!==ME).join(', ')}`);
      if(!PARTICIPANTES.includes(dest)) return alert('Inválido.');
      let txt=prompt(`Mensagem de ${ME} para ${dest}:`);
      if(!txt) return;
      channel.postMessage({type:'msg',data:{from:ME,to:dest,text:txt.trim()}});
      alert('Enviado!');
    }
    function lerConversa(){
      alert('Use o chat do destinatário.');
    }

    function autoConceder(){
      const origens = ['Litlegot','Psique','Hell Cat','Beast','Cobra','Lindemberg'];
      let escolha = prompt(`De quem herdar poder?\n${origens.join(', ')}`);
      if(!origens.includes(escolha)) return alert('Inválido.');
      let poder = prompt(`Qual poder de ${escolha}?`);
      if(!poder) return;
      const p = {from:escolha, to:ME, power:poder.trim(), meta:{inherited:true}};
      channel.postMessage({type:'power',data:p});
    }

    function verPoderes(){
      const ps=_load('powers').filter(p=>p.to===ME);
      if(!ps.length) return alert('Sem poderes.');
      alert(ps.map((p,i)=>`${i+1}. ${p.power} (de ${p.from})`).join('\n'));
    }

    function usarPoder(){
      const ps=_load('powers').filter(p=>p.to===ME);
      if(!ps.length) return alert('Sem poderes.');
      let idx=+prompt(ps.map((p,i)=>`${i+1}. ${p.power}`).join('\n')+'\n\nnº:')-1;
      if(!ps[idx]) return alert('Inválido.');
      const p = ps[idx];
      let target = prompt(`Aplicar "${p.power}" em quem?\n${PARTICIPANTES.filter(x=>x!==ME).join(', ')}`);
      if(!PARTICIPANTES.includes(target)) return alert('Inválido.');
      channel.postMessage({type:'usePower',data:{from:ME,to:target,power:p.power}});
      alert(`🚀 Você usou "${p.poder}" em ${target}`);
    }
  </script>
</body>
</html>
